[package]
name = "rust_quicklog"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "rust_quicklog"

[[bin]]
name = "rust_quicklog"
path = "src/main.rs"

[[bin]]
name = "log_llm"
path = "src/bin/log_llm_resilient.rs"

[dependencies]
chrono = "0.4.39"
rouille = "3.6.2"
serde = { version = "1.0.217", features = ["derive"] }
rand = "0.8.5"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0.135"
